<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inscription : l'élève - Complexe Scolaire InspiDigit</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
     <h2><img class="logo" src="images/logo.jpeg" alt="Logo du Complexe Scolaire InspiDigit"> Complexe Scolaire InspiDigit</h2>
    <nav>
      <a href="index.html">Accueil</a>
      <a href="a-propos.html">À propos</a>
      <a href="contact.html">Contact</a>
      <a class="bouton-contour" href="connexion.html">S'identifier</a>
    </nav>
  </header>

  <main>
    <h1>Inscription en ligne</h1>
    <p class="sous-titre">Année scolaire 2026-2027</p>

    <ol class="etapes">
      <li class="actuelle">1. Élève</li>
      <li>2. Scolarité</li>
      <li>3. Parent</li>
      <li>4. Contact</li>
    </ol>

    <p class="avis">Maquette : n'entrez aucune vraie information. Rien n'est envoyé.</p>

    <form id="formulaire" class="formulaire" onsubmit="event.preventDefault(); suivant(this, 'inscription-scolarite.html');">

      <h2 class="titre-section">L'élève</h2>

      <label for="nom">Nom</label>
      <input type="text" id="nom" name="nom" required>

      <label for="postnom">Postnom</label>
      <input type="text" id="postnom" name="postnom">

      <label for="prenom">Prénom</label>
      <input type="text" id="prenom" name="prenom" required>

      <label>Sexe</label>
      <div class="choix">
        <label><input type="radio" name="sexe" value="F" required> Fille</label>
        <label><input type="radio" name="sexe" value="M"> Garçon</label>
      </div>

      <label for="naissance">Date de naissance</label>
      <input type="date" id="naissance" name="naissance" required>

      <label for="lieu">Lieu de naissance</label>
      <input type="text" id="lieu" name="lieu">

      <label for="nationalite">Nationalité</label>
      <input type="text" id="nationalite" name="nationalite">

      <div class="actions">
        <a class="bouton-contour" href="index.html">Annuler</a>
        <button class="bouton" type="submit">Suivant</button>
      </div>

    </form>
  </main>

  <script src="inscription.js"></script>
  <script>
    restaurer(document.getElementById("formulaire"));
  </script>
<script src="inscription.js"></script>
</body>
</html>
